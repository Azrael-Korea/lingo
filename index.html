<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>두 언어 회화 – 영어·스페인어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --ink:#1f2a44; --muted:#6b7280; --line:#e7e2d9;
  --en:#2f6fdb; --en-soft:#e8f0fd; --es:#d9532b; --es-soft:#fdece6;
  --ok:#1a9a5a; --ok-soft:#e5f6ec; --bad:#d23b3b; --bad-soft:#fde9e9;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.3px}
header.top h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px}
.notice{background:#fff8e1;border:1px solid #f1dfa6;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:14px}
.notice b{font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;text-align:center}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab small{display:block;font-size:11px;opacity:.7}
.review-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.review-bar .t{font-size:14px}
.review-bar .t b{font-size:18px}
.pill-btn{padding:9px 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:500}
.pill-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.pill-btn:disabled{opacity:.35}
.unit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.unit.locked{opacity:.55}
.unit .num{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.unit .body{flex:1;min-width:0}
.unit .title{font-weight:700;font-size:15px}
.unit .pat{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--bg);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.unit .pct{font-size:12px;color:var(--muted);flex:none;text-align:right;min-width:40px}
/* unit page */
.back{font-size:14px;color:var(--muted);padding:6px 0;margin-bottom:6px}
.unit-head h2{margin:0 0 4px;font-size:22px}
.unit-head .g{font-size:13px;color:var(--muted);line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 14px}
.mode{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.mode b{font-size:16px;display:block;margin-bottom:4px}
.mode span{font-size:13px;color:var(--muted);line-height:1.5}
.list{margin-top:16px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:13px;line-height:1.55}
.row .ko{font-weight:500}
.row .en{color:var(--en)}
.row .es{color:var(--es)}
.row .mark{float:right;font-size:12px}
/* practice */
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pbar .track{flex:1;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.pbar .track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.pbar .cnt{font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:0 2px 10px rgba(31,42,68,.04)}
.ko-big{font-size:22px;font-weight:700;line-height:1.45;letter-spacing:-.3px;margin-bottom:16px}
.lang{border-radius:14px;padding:14px;margin-top:10px}
.lang.en{background:var(--en-soft)}
.lang.es{background:var(--es-soft)}
.lang.dim{opacity:.45}
.lang .lab{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.4px;margin-bottom:6px}
.lang.en .lab{color:var(--en)}
.lang.es .lab{color:var(--es)}
.lang .txt{font-size:18px;line-height:1.5;font-weight:500}
.lang .txt .w{border-radius:4px;padding:0 1px}
.lang .txt .w.hit{color:var(--ok)}
.lang .txt .w.miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.lang .heard{font-size:13px;color:var(--muted);margin-top:6px}
.lang .placeholder{font-size:15px;color:var(--muted)}
.speak-btn{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.score{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.score.ok{background:var(--ok-soft);color:var(--ok)}
.score.bad{background:var(--bad-soft);color:var(--bad)}
.note{font-size:13px;line-height:1.55;background:#fffbea;border-radius:10px;padding:8px 10px;margin-top:12px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .grow{flex:1}
.big{width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:700;background:var(--ink);color:#fff}
.big.en{background:var(--en)}
.big.es{background:var(--es)}
.big.ok{background:var(--ok)}
.big.bad{background:var(--bad)}
.big.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.mic{width:84px;height:84px;border-radius:50%;margin:18px auto 6px;display:grid;place-items:center;font-size:34px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.mic.en{background:var(--en)} .mic.es{background:var(--es)}
.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(210,59,59,.45)}70%{box-shadow:0 0 0 18px rgba(210,59,59,0)}100%{box-shadow:0 0 0 0 rgba(210,59,59,0)}}
.mic-hint{text-align:center;font-size:13px;color:var(--muted);min-height:20px}
.small-links{display:flex;justify-content:center;gap:16px;margin-top:10px}
.small-links button{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.summary{text-align:center}
.summary .big-num{font-size:44px;font-weight:700;margin:10px 0 0}
.summary .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.statrow{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;border-radius:14px;padding:12px}
.stat.en{background:var(--en-soft);color:var(--en)} .stat.es{background:var(--es-soft);color:var(--es)}
.stat b{display:block;font-size:22px}
/* settings */
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,36,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:700}
.sheet .info{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
.listen-ctrl{display:flex;gap:8px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:rgba(255,255,255,.85);border-radius:9px;padding:5px 9px;font-size:13px;line-height:1.35}
.chip b{font-weight:700;margin-right:5px}
.chips.en .chip b{color:var(--en)} .chips.es .chip b{color:var(--es)}
.chips-title{font-size:11px;color:var(--muted);margin-top:10px;font-weight:700;letter-spacing:.3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;max-width:90%;text-align:center}
</style>
</head>

<script>
(function(){

// ---------- storage (localStorage with in-memory fallback) ----------
const KEY = "bilingo.v1";

let S = load() || {};
S.stats = S.stats || {};      // sid -> {en:0|1, es:0|1, n:count}
S.set = Object.assign({ esVar:"es-MX", enVar:"en-US", rate:0.9, useMic:true, autoNext:true, wordHint:"always", showWords:true }, S.set || {});

const UNITS = {}; CURRICULUM.forEach(L => L.units.forEach(u => { u.level = L.level; UNITS[u.id] = u; }));
function sentences(u){ return (u.s || []).map((a, i) => ({ sid: u.id + "-" + i, unit: u.id, ko: a[0], en: a[1], es: a[2], note: a[3] || "" })); }
function allSentences(){ let r = []; CURRICULUM.forEach(L => L.units.forEach(u => r = r.concat(sentences(u)))); return r; }
function unitProgress(u){
  const list = sentences(u); if(!list.length) return 0;
  const done = list.filter(x => { const st = S.stats[x.sid]; return st && st.en === 1 && st.es === 1; }).length;
  return Math.round(done / list.length * 100);
}

// ---------- word glosses ----------
const glossCache = {};
function gloss(text, lang){
  const ck = lang + "|" + text; if(glossCache[ck]) return glossCache[ck];
  const dict = (typeof GLOSS !== "undefined" ? GLOSS : {})[lang] || {};
  const raw = text.split(/\s+/).filter(Boolean).map(w => w.replace(/^[^\p{L}\d']+|[^\p{L}\d']+$/gu, ""));
  const key = raw.map(w => w.toLowerCase().replace(/[’]/g, "'"));
  const out = [];
  for(let i = 0; i < raw.length; ){
    let hit = null;
    for(let n = Math.min(7, raw.length - i); n >= 1; n--){
      const k = key.slice(i, i + n).join(" ");
      if(dict[k]){ hit = { t: raw.slice(i, i + n).join(" "), m: dict[k], n }; break; }
    }
    if(hit){ out.push(hit); i += hit.n; } else { if(raw[i]) out.push({ t: raw[i], m: "" }); i++; }
  }
  return glossCache[ck] = out;
}

  let h = 0; for(const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  // 원래 순서와 같으면 한 번 돌림
  if(a.length > 1 && a.every((x, k) => x === arr[k])) a.push(a.shift());
  return a;
}
function chipsHtml(items, lang){
  return `<div class="chips ${lang}">${items.filter(x => x.m).map(x => `<span class="chip"><b>${esc(x.t)}</b>${esc(x.m)}</span>`).join("")}</div>`;
}

// ---------- speech synthesis ----------
const synth = window.speechSynthesis;
let voices = [];

function langCode(lang){ return lang === "en" ? S.set.enVar : S.set.esVar; }
function pickVoice(code){
  if(!voices.length) refreshVoices();
  const base = code.slice(0,2);
  const exact = voices.filter(v => v.lang && v.lang.replace("_","-").toLowerCase() === code.toLowerCase());
  const pref = v => (/google|natural|premium|enhanced|siri/i.test(v.name) ? 0 : 1);
  if(exact.length) return exact.sort((a,b) => pref(a)-pref(b))[0];
  const alt = code === "es-MX" ? ["es-US","es-419"] : code === "es-ES" ? [] : code === "en-US" ? ["en-CA"] : ["en-AU","en-IE"];
  for(const a of alt){ const v = voices.find(v => v.lang && v.lang.replace("_","-").toLowerCase() === a.toLowerCase()); if(v) return v; }
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith(base)) || null;
}
function speak(text, lang, rateMul){
  return new Promise(resolve => {
    if(!synth){ toast("이 브라우저는 음성 재생을 지원하지 않아요."); return resolve(); }

    let finals = null, lastInterim = "", err = null;

      const res = ev.results[ev.results.length - 1];
      if(res.isFinal){ finals = []; for(let i = 0; i < res.length; i++) finals.push(res[i].transcript); }
      else { lastInterim = res[0].transcript; onInterim && onInterim(lastInterim); }
    };
    rec.onerror = ev => { err = ev.error; };
    rec.onend = () => {
      activeRec = null;
      if(err === "not-allowed" || err === "service-not-allowed" || err === "audio-capture"){ micBlocked = true; return resolve({ error: err }); }

      if(lastInterim) return resolve({ alts: [lastInterim] });

  });
}

// ---------- answer checking ----------
const EN_CONTR = { "i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","what's":"what is","where's":"where is","there's":"there is","here's":"here is","let's":"let us","i'd":"i would","you'd":"you would","i'll":"i will","you'll":"you will","we'll":"we will","i've":"i have","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","haven't":"have not","okay":"ok" };
const EN_NUM = { zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19 };
const EN_TENS = { twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90 };
const ES_NUM = { cero:0,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29 };
const ES_TENS = { treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90 };
function stripAccents(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function norm(text, lang){
  let s = text.toLowerCase().replace(/[’‘`]/g, "'");
  s = s.replace(/\$\s?(\d+)/g, lang === "en" ? "$1 dollars" : "$1 dolares");
  s = s.replace(/wi-?fi/g, "wifi");
  if(lang === "en") s = s.replace(/[a-z]+'[a-z]+|cannot|okay/g, m => EN_CONTR[m] || m);
  s = stripAccents(s).replace(/[^a-z0-9ñ'\s-]/g, " ").replace(/[-']/g, " ");
  let w = s.split(/\s+/).filter(Boolean);
  // numbers -> digits
  const out = [];
  for(let i = 0; i < w.length; i++){
    const t = w[i];
    if(lang === "en"){
      if(t in EN_TENS){ const n = w[i+1]; if(n && EN_NUM[n] > 0 && EN_NUM[n] < 10){ out.push(String(EN_TENS[t] + EN_NUM[n])); i++; } else out.push(String(EN_TENS[t])); continue; }
      if(t in EN_NUM){ out.push(String(EN_NUM[t])); continue; }
    } else {
      if(t in ES_TENS){ if(w[i+1] === "y" && w[i+2] in ES_NUM && ES_NUM[w[i+2]] < 10){ out.push(String(ES_TENS[t] + ES_NUM[w[i+2]])); i += 2; } else out.push(String(ES_TENS[t])); continue; }
      if(t in ES_NUM){ out.push(String(ES_NUM[t])); continue; }
    }
    out.push(t);
  }
  // 21~99 숫자는 '십의 자리 + 일의 자리'로 쪼개서 양쪽 표기를 맞춤 (thirty five = 35, treinta y cinco = 35)
  const fin = [];
  out.forEach(t => {
    const n = /^\d+$/.test(t) ? +t : -1;
    if(n > 20 && n < 100 && n % 10 && !(lang === "es" && n < 30)){
      fin.push(String(n - n % 10)); if(lang === "es") fin.push("y"); fin.push(String(n % 10));
    } else fin.push(t);
  });
  return fin;
}
// display tokens of target with their normalized forms (for highlighting)
function targetTokens(text, lang){
  return text.split(/\s+/).filter(Boolean).map(tok => ({ raw: tok, n: norm(tok, lang) }));
}
function lcsMatch(a, b){ // returns boolean array for a (target) words matched in b
  const n = a.length, m = b.length, dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for(let i = n-1; i >= 0; i--) for(let j = m-1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const hit = new Array(n).fill(false); let i = 0, j = 0;
  while(i < n && j < m){ if(a[i] === b[j]){ hit[i] = true; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  return hit;
}
function grade(target, alts, lang){
  const toks = targetTokens(target, lang);
  const flat = []; toks.forEach((t, ti) => t.n.forEach(w => flat.push({ w, ti })));
  // please / por favor 는 빠뜨려도 감점하지 않음
  flat.forEach((f, k) => { f.opt = lang === "en" ? f.w === "please" : (f.w === "favor" && k > 0 && flat[k-1].w === "por") || (f.w === "por" && flat[k+1] && flat[k+1].w === "favor"); });
  let best = null;
  for(const alt of alts){
    const said = norm(alt, lang);
    const hit = lcsMatch(flat.map(f => f.w), said);
    const req = flat.filter(f => !f.opt).length;
    const got = flat.filter((f, k) => !f.opt && hit[k]).length;
    const score = req ? got / req : 0;
    if(!best || score > best.score) best = { score, hit, heard: alt };
  }
  const tokHit = toks.map(() => true);
  flat.forEach((f, k) => { if(!best.hit[k] && !f.opt) tokHit[f.ti] = false; });
  return { score: best.score, heard: best.heard, tokens: toks.map((t, k) => ({ raw: t.raw, hit: tokHit[k] })), pass: best.score >= 0.8 };
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function on(sel, fn){ app.querySelectorAll(sel).forEach(el => el.addEventListener("click", fn)); }

        <button class="big ghost" id="next" style="flex:1">다음 →</button>
      </div>
      <div class="mic-hint" style="margin-top:10px">연속 재생: 각 문장을 들려준 뒤 따라 말할 시간을 줘요.</div>
    </div>`;
  on("#back", () => go({ name:"unit", unit:v.unit }));
  on("#p-en", () => { stopAuto(); speak(x.en, "en"); });
  on("#p-es", () => { stopAuto(); speak(x.es, "es"); });
  on("#prev", () => { stopAuto(); v.i--; render(); });
  on("#next", () => { stopAuto(); if(v.i < v.list.length - 1){ v.i++; render(); } else go({ name:"unit", unit:v.unit }); });
  on("#auto", () => { if(v.auto){ stopAuto(); render(); } else { v.auto = true; render(); runAuto(); } });
}
function stopAuto(){ if(view.auto){ view.auto = false; listenToken++; try{ synth.cancel(); }catch(e){} } }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function runAuto(){
  const tok = ++listenToken, v = view;
  while(v.auto && tok === listenToken){
    const x = v.list[v.i];
    for(const lang of ["en", "es"]){
      if(tok !== listenToken) return;
      const box = document.getElementById("L-" + lang); const other = document.getElementById("L-" + (lang === "en" ? "es" : "en"));
      if(box) box.classList.remove("dim"); if(other) other.classList.add("dim");
      const t0 = Date.now(); await speak(x[lang], lang); const dur = Date.now() - t0;
      if(tok !== listenToken) return;
      await wait(Math.max(1500, dur * 1.3)); // 따라 말할 시간
    }
    if(tok !== listenToken) return;
    if(v.i < v.list.length - 1){ v.i++; render(); } else { v.auto = false; render(); return; }
  }
}

// ----- speak mode -----
function startSpeak(list, title, unit){
  if(!list.length) return;
  go({ name:"speak", list, i:0, title, unit, phase:"en", res:{}, revealed:{}, results:[], interim:"" });
}
function record(sid, lang, pass){
  const st = S.stats[sid] || (S.stats[sid] = { n:0 });
  st[lang] = pass ? 1 : 0; if(lang === "es") st.n++;
  save();
}
function renderSpeak(){
  const v = view, x = v.list[v.i];
  const flag = S.set.esVar === "es-ES" ? "🇪🇸" : "🇲🇽";
  const block = lang => {
    const r = v.res[lang], active = v.phase === lang, revealed = v.revealed[lang];
    const label = lang === "en" ? "🇺🇸 ENGLISH" : flag + " ESPAÑOL";
    let inner;
    const words = S.set.showWords ? chipsHtml(gloss(x[lang], lang), lang) : "";
    if(r && r.tokens){
      inner = `<div class="txt">${r.tokens.map(t => `<span class="w ${t.hit ? "hit" : "miss"}">${esc(t.raw)}</span>`).join(" ")}</div>
        <div class="heard">들린 말: “${esc(r.heard)}”</div>${words}`;
    } else if(revealed || (r && r.self !== undefined)){
      inner = `<div class="txt">${esc(x[lang])}</div>${words}`;
    } else if(active){
      const showChips = S.set.wordHint === "always" || v.chips === lang;
      const items = seededShuffle(gloss(x[lang], lang).filter(g => g.m), x.sid + lang);
      inner = `<div class="placeholder">${v.interim ? "“" + esc(v.interim) + "”" : (lang === "en" ? "영어로 말해 보세요" : "이번엔 스페인어로 말해 보세요")}</div>
        ${showChips ? `<div class="chips-title">힌트 단어 (순서는 섞여 있어요)</div>${chipsHtml(items, lang)}` : ""}
        ${v.hint && v.hint === lang ? `<div class="heard">첫 단어: ${esc(x[lang].split(" ").slice(0, 2).join(" "))} …</div>` : ""}`;
    } else {
      inner = `<div class="placeholder">영어 다음 차례</div>`;
    }
    const badge = r && r.self !== undefined ? `<span class="score ${r.pass ? "ok" : "bad"}">${r.pass ? "맞음" : "다시"}</span>`
               : r && r.tokens ? `<span class="score ${r.pass ? "ok" : "bad"}">${Math.round(r.score * 100)}점</span>` : "";
    const showPlay = r || revealed;
    return `<div class="lang ${lang} ${!active && !r && !revealed ? "dim" : ""}"><div class="lab"><span>${label} ${badge}</span>${showPlay ? `<button class="speak-btn" data-play="${lang}">🔊</button>` : ""}</div>${inner}</div>`;
  };
  const cur = v.phase, r = v.res[cur];
  let controls = "";
  if(cur !== "done"){
    if(r){
      controls = `<div class="actions">
        <button class="big ghost grow" id="retry">🎤 다시</button>
        <button class="big ${cur === "en" ? "es" : ""} grow" id="advance">${cur === "en" ? "스페인어로 →" : (v.i < v.list.length - 1 ? "다음 문장 →" : "결과 보기")}</button></div>`;
    } else if(v.revealed[cur] && !canMic()){
      controls = `<div class="actions"><button class="big bad grow" id="selfbad">✗ 틀렸어요</button><button class="big ok grow" id="selfok">✓ 맞았어요</button></div>`;
    } else if(canMic()){
      controls = `<button class="mic ${cur} ${v.listening ? "rec" : ""}" id="mic" aria-label="말하기">${v.listening ? "■" : "🎤"}</button>
        <div class="mic-hint">${v.listening ? "듣고 있어요… 다 말하면 잠시 기다리세요" : "버튼을 누르고 말하세요"}</div>
        <div class="small-links">${S.set.wordHint !== "always" && v.chips !== cur ? `<button id="chipsbtn">힌트 단어</button>` : ""}<button id="hint">첫 단어</button><button id="giveup">모르겠어요</button></div>`;
    } else {
      controls = `<div class="mic-hint" style="margin-top:14px">소리 내어 말한 다음 정답을 확인하세요</div>
        <div class="actions"><button class="big ${cur}" id="reveal" style="width:100%">정답 확인 🔊</button></div>
        <div class="small-links">${S.set.wordHint !== "always" && v.chips !== cur ? `<button id="chipsbtn">힌트 단어</button>` : ""}<button id="hint">첫 단어</button></div>`;
    }
  }
  app.innerHTML = `
    ${v.i === 0 && cur === "en" && !r ? micNotice() : ""}
    <div class="pbar"><button class="back" id="back" style="margin:0">✕</button>
      <div class="track"><i style="width:${(v.i + (cur === "en" ? 0 : .5)) / v.list.length * 100}%"></i></div><div class="cnt">${v.i + 1}/${v.list.length}</div></div>
    <div class="card">
      <div class="ko-big">${esc(x.ko)}</div>
      ${block("en")}${block("es")}
      ${x.note && (v.res.es || v.revealed.es) ? `<div class="note">📝 ${esc(x.note)}</div>` : ""}
      ${controls}
    </div>`;
  on("#back", () => go(v.unit ? { name:"unit", unit:v.unit } : { name:"home" }));
  app.querySelectorAll("[data-play]").forEach(b => b.addEventListener("click", () => speak(x[b.dataset.play], b.dataset.play)));
  on("#mic", () => v.listening ? stopListening() : doListen());
  on("#hint", () => { v.hint = cur; render(); });
  on("#chipsbtn", () => { v.chips = cur; render(); });
  on("#giveup", () => { v.res[cur] = { tokens: targetTokens(x[cur], cur).map(t => ({ raw:t.raw, hit:false })), score:0, pass:false, heard:"(건너뜀)" }; record(x.sid, cur, false); render(); speak(x[cur], cur); });
  on("#reveal", () => { v.revealed[cur] = true; render(); speak(x[cur], cur); });
  on("#selfok", () => selfGrade(true));
  on("#selfbad", () => selfGrade(false));
  on("#retry", () => { delete v.res[cur]; v.revealed[cur] = false; v.interim = ""; render(); if(canMic()) doListen(); });
  on("#advance", advance);
}
function selfGrade(pass){
  const v = view, x = v.list[v.i], cur = v.phase;
  v.res[cur] = { self:true, pass }; record(x.sid, cur, pass); render();
  if(pass && S.set.autoNext) setTimeout(() => { if(view === v && v.res[cur]) advance(); }, 500);
}
async function doListen(){
  const v = view, x = v.list[v.i], cur = v.phase, tok = ++listenToken;
  try{ synth && synth.cancel(); }catch(e){}
  v.listening = true; v.interim = ""; render();
  const out = await listen(cur, t => { if(tok === listenToken){ v.interim = t; const p = app.querySelector(".lang." + cur + " .placeholder"); if(p) p.textContent = "“" + t + "”"; } });
  if(tok !== listenToken) return;
  v.listening = false;
  if(out.error){
    if(micBlocked){ toast("마이크를 쓸 수 없어서 스스로 채점 방식으로 바꿨어요."); }
    else if(out.error === "no-speech"){ toast("소리가 들리지 않았어요. 다시 눌러 말해 보세요."); }
    else toast("음성 인식 오류: " + out.error);
    render(); return;
  }
  const g = grade(x[cur], out.alts, cur);
  v.res[cur] = g; record(x.sid, cur, g.pass); render();
  await speak(x[cur], cur);
  if(g.pass && S.set.autoNext && view === v && v.res[cur] === g) advance();
}
function advance(){
  const v = view, x = v.list[v.i];
  if(v.phase === "en"){ v.phase = "es"; v.interim = ""; v.hint = null; v.chips = null; render(); if(canMic() && S.set.autoNext) doListen(); return; }
  v.results.push({ sid:x.sid, en:!!(v.res.en && v.res.en.pass), es:!!(v.res.es && v.res.es.pass) });
  if(v.i < v.list.length - 1){
    v.i++; v.phase = "en"; v.res = {}; v.revealed = {}; v.interim = ""; v.hint = null; v.chips = null; render();
    if(canMic() && S.set.autoNext) doListen();
  } else {
    go({ name:"summary", results:v.results, title:v.title, unit:v.unit, list:v.list });
  }
}
function renderSummary(){
  const v = view, n = v.results.length;
  const en = v.results.filter(r => r.en).length, es = v.results.filter(r => r.es).length;
  const pct = n ? Math.round((en + es) / (n * 2) * 100) : 0;
  const wrong = v.list.filter(x => { const r = v.results.find(r => r.sid === x.sid); return r && (!r.en || !r.es); });
  app.innerHTML = `
    <div class="card summary">
      <div style="font-size:14px;color:var(--muted)">${esc(v.title)}</div>
      <div class="big-num">${pct}%</div>
      <div class="sub">${pct >= 80 ? "좋아요! 다음 단원으로 넘어가도 돼요." : "틀린 문장을 한 번 더 연습해 보세요."}</div>
      <div class="statrow"><div class="stat en"><b>${en}/${n}</b>영어</div><div class="stat es"><b>${es}/${n}</b>스페인어</div></div>
      ${wrong.length ? `<button class="big" id="again" style="margin-bottom:8px">틀린 ${wrong.length}문장 다시 하기</button>` : ""}
      <button class="big ghost" id="home">${v.unit ? "단원으로 돌아가기" : "처음으로"}</button>
    </div>`;
  on("#again", () => startSpeak(wrong, v.title + " (다시)", v.unit));
  on("#home", () => go(v.unit ? { name:"unit", unit:v.unit } : { name:"home" }));
}

// ----- settings -----
function openSettings(){
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  const seg = (key, opts) => `<div class="seg" data-k="${key}">${opts.map(([val, lab]) => `<button data-v="${val}" class="${String(S.set[key]) === String(val) ? "on" : ""}">${lab}</button>`).join("")}</div>`;
  const vEn = pickVoice(S.set.enVar), vEs = pickVoice(S.set.esVar);
  bg.innerHTML = `<div class="sheet">
    <h3>설정</h3>
    <div class="field"><label>스페인어 발음·인식</label>${seg("esVar", [["es-MX","🇲🇽 중남미(멕시코)"],["es-ES","🇪🇸 스페인"]])}</div>
    <div class="field"><label>영어 발음·인식</label>${seg("enVar", [["en-US","🇺🇸 미국"],["en-GB","🇬🇧 영국"]])}</div>
    <div class="field"><label>말하기 속도</label>${seg("rate", [[0.7,"천천히"],[0.9,"보통"],[1.05,"빠르게"]])}</div>
    <div class="field"><label>음성 인식으로 채점</label>${seg("useMic", [[true,"사용"],[false,"스스로 채점"]])}</div>
    <div class="field"><label>말하기 도전: 힌트 단어</label>${seg("wordHint", [["always","항상 보이기"],["tap","눌러서 보기"]])}</div>
    <div class="field"><label>듣기·정답에 단어 뜻 표시</label>${seg("showWords", [[true,"보이기"],[false,"숨기기"]])}</div>
    <div class="field"><label>맞히면 자동으로 다음</label>${seg("autoNext", [[true,"켜기"],[false,"끄기"]])}</div>
    <div class="info">재생 음성: 영어 ${esc(vEn ? vEn.name : "기본")}, 스페인어 ${esc(vEs ? vEs.name : "기본(기기에 스페인어 음성이 없을 수 있어요)")}<br>
    음성 인식: ${SR ? (micBlocked ? "이 화면에서는 마이크가 막혀 있어요" : "사용 가능") : "이 브라우저는 미지원"}</div>
    <div class="actions"><button class="big ghost grow" id="reset">학습 기록 초기화</button><button class="big grow" id="close">닫기</button></div>
  </div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if(e.target === bg) close(); });
  bg.querySelectorAll(".seg").forEach(sg => sg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const k = sg.dataset.k; let val = b.dataset.v;
    if(val === "true") val = true; else if(val === "false") val = false; else if(!isNaN(+val)) val = +val;
    S.set[k] = val; save();
    sg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    if(k === "esVar") speak("Hola, ¿cómo estás?", "es"); if(k === "enVar") speak("Hi, how are you?", "en"); if(k === "rate") speak("Nice to meet you.", "en");
  })));
  let armed = false;
  bg.querySelector("#reset").addEventListener("click", e => { if(!armed){ armed = true; e.currentTarget.textContent = "한 번 더 누르면 초기화"; return; } S.stats = {}; save(); close(); toast("학습 기록을 지웠어요."); });
  bg.querySelector("#close").addEventListener("click", close);
  function close(){ bg.remove(); render(); }
}

window.__bilingo = { grade, norm, gloss };
render();
})();
</script>
